<div class="contact-hero">
  <div class="contact-status-badge">
    <span class="status-dot-pulse"></span>
    <span>Available</span>
  </div>
  <h1 class="contact-title">Let's Connect &amp; <span class="text-gradient">Collaborate</span></h1>
</div>

<div class="contact-page-container">

  <!-- Interactive Quick Form -->
  <div class="contact-card message-form-card">
    <div class="card-header-bar">
      <div class="contact-card-icon form-icon-bg">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
      </div>
      <div>
        <h3>Send a Direct Message</h3>
      </div>
    </div>

    <form class="contact-form" id="quickContactForm" novalidate>
      <!-- Identity Fields (Optional: auto-detects anonymous / name / email) -->
      <div class="form-row" id="identityRow">
        <div class="form-group" id="nameGroup">
          <label for="contactName">Your Name <span class="label-hint">(optional)</span></label>
          <input type="text" id="contactName" name="name" placeholder="Name or pseudonym" autocomplete="name" />
        </div>
        <div class="form-group" id="emailGroup">
          <label for="contactEmail">Your Email ID <span class="label-hint">(optional, for reply)</span></label>
          <input type="email" id="contactEmail" name="email" placeholder="name@company.com" autocomplete="email" />
        </div>
      </div>

      <div class="form-group">
        <label for="contactSubject">Subject <span class="label-required">*</span></label>
        <input type="text" id="contactSubject" name="subject" placeholder="Project Inquiry / Tech Discussion / General" required />
      </div>

      <div class="form-group">
        <label for="contactMessage">Message <span class="label-required">*</span></label>
        <textarea id="contactMessage" name="message" rows="4" placeholder="Write your message here..." required></textarea>
      </div>

      <button type="submit" class="contact-submit-btn" id="contactSubmitBtn">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="btnIcon">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
        <span id="btnText">Send Message</span>
      </button>

      <!-- Dynamic Feedback Banner -->
      <div class="contact-status-message" id="formStatusMsg" style="display: none;"></div>
    </form>
  </div>

  <!-- Footer Note & Timezone Info -->
  <div class="contact-footer-card">
    <div class="tz-info-item">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <polyline points="12 6 12 12 16 14"></polyline>
      </svg>
      <span>Based in <strong>IST (UTC +5:30)</strong> &bull; Open for remote discussions worldwide</span>
    </div>
    <div class="response-time-pill">
      <span class="response-pulse"></span>
      <span>Average response: &lt; 24 hrs</span>
    </div>
  </div>

</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const FORM_BACKEND_URL = 'https://formspree.io/f/mnpqbvja';

  const nameInput = document.getElementById('contactName');
  const emailInput = document.getElementById('contactEmail');
  const subjectInput = document.getElementById('contactSubject');
  const messageInput = document.getElementById('contactMessage');
  const form = document.getElementById('quickContactForm');
  const submitBtn = document.getElementById('contactSubmitBtn');
  const btnText = document.getElementById('btnText');
  const btnIcon = document.getElementById('btnIcon');
  const statusMsg = document.getElementById('formStatusMsg');

  // Clear error highlight when typing
  [emailInput, subjectInput, messageInput].forEach(input => {
    if (input) {
      input.addEventListener('input', function() {
        input.classList.remove('input-error');
        if (statusMsg && statusMsg.classList.contains('error')) {
          statusMsg.style.display = 'none';
        }
      });
    }
  });

  // Pre-fill query parameters if present (e.g. ?subject=...)
  const params = new URLSearchParams(window.location.search);
  const subjectParam = params.get('subject') || (params.get('service') ? `Inquiry: ${params.get('service')}` : null);
  const messageParam = params.get('message');
  if (subjectParam && subjectInput) {
    subjectInput.value = subjectParam;
  }
  if (messageParam && messageInput) {
    messageInput.value = messageParam;
  }

  // Handle Form Submission
  if (form) {
    form.addEventListener('submit', async function(e) {
      e.preventDefault();

      const rawName = nameInput ? nameInput.value.trim() : '';
      const rawEmail = emailInput ? emailInput.value.trim() : '';
      const subject = subjectInput ? subjectInput.value.trim() : '';
      const message = messageInput ? messageInput.value.trim() : '';

      // Mandatory validation for Subject and Message
      if (!subject) {
        subjectInput.classList.add('input-error');
        subjectInput.focus();
        statusMsg.className = 'contact-status-message error';
        statusMsg.innerHTML = '✕ <strong>Subject required:</strong> Please provide a subject for your message.';
        statusMsg.style.display = 'flex';
        return;
      }

      if (!message) {
        messageInput.classList.add('input-error');
        messageInput.focus();
        statusMsg.className = 'contact-status-message error';
        statusMsg.innerHTML = '✕ <strong>Message required:</strong> Please write a message before sending.';
        statusMsg.style.display = 'flex';
        return;
      }

      // If email is provided, validate email format
      if (rawEmail) {
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
        if (!emailRegex.test(rawEmail)) {
          emailInput.classList.add('input-error');
          emailInput.focus();
          statusMsg.className = 'contact-status-message error';
          statusMsg.innerHTML = '✕ <strong>Invalid Email:</strong> Please enter a valid email address (or leave it blank to submit anonymously).';
          statusMsg.style.display = 'flex';
          return;
        }
      }

      // Automatically determine identity mode
      let mode = 'anonymous';
      let displayName = 'Anonymous';
      let modeTag = '[Anonymous]';

      if (rawName && rawEmail) {
        mode = 'professional';
        displayName = rawName;
        modeTag = `[Email: ${rawName}]`;
      } else if (rawEmail && !rawName) {
        mode = 'email_only';
        displayName = rawEmail.split('@')[0];
        modeTag = `[Email: ${rawEmail}]`;
      } else if (rawName && !rawEmail) {
        mode = 'name_only';
        displayName = rawName;
        modeTag = `[Name: ${rawName}]`;
      }

      // UI: Loading state
      submitBtn.disabled = true;
      btnText.textContent = 'Sending Message...';
      btnIcon.innerHTML = '<span class="btn-spinner"></span>';
      statusMsg.style.display = 'none';

      const payload = {
        name: displayName,
        sender_mode: mode,
        _subject: `${modeTag} ${subject}`,
        subject: subject,
        message: message
      };

      if (rawEmail) {
        payload.email = rawEmail;
        payload._replyto = rawEmail;
      }

      try {
        if (FORM_BACKEND_URL && FORM_BACKEND_URL.startsWith('http')) {
          const res = await fetch(FORM_BACKEND_URL, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Accept': 'application/json'
            },
            body: JSON.stringify(payload)
          });

          if (!res.ok) {
            let errorDetail = 'Unable to send at this moment. Please check your connection.';
            try {
              const data = await res.json();
              if (data && data.errors && data.errors.length > 0) {
                const emailErr = data.errors.find(err => err.field === 'email');
                if (emailErr) {
                  emailInput.classList.add('input-error');
                  emailInput.focus();
                  errorDetail = 'The email address entered is invalid. Please check for typos or leave it blank.';
                } else {
                  errorDetail = data.errors.map(err => err.message).join('. ');
                }
              } else if (data && data.error) {
                errorDetail = data.error;
              }
            } catch (_) {}

            throw new Error(errorDetail);
          }
        } else {
          await new Promise(resolve => setTimeout(resolve, 800));
        }

        // UI: Success feedback tailored to how they submitted
        statusMsg.className = 'contact-status-message success';
        if (mode === 'anonymous') {
          statusMsg.innerHTML = '✓ <strong>Message sent!</strong> Delivered 100% anonymously.';
        } else if (mode === 'name_only') {
          statusMsg.innerHTML = `✓ <strong>Message sent!</strong> Delivered from ${displayName} (private mode).`;
        } else {
          statusMsg.innerHTML = `✓ <strong>Message sent!</strong> Thank you, ${displayName}! I will review your message and reply to <strong>${rawEmail}</strong>.`;
        }
        statusMsg.style.display = 'flex';

        form.reset();
      } catch (err) {
        statusMsg.className = 'contact-status-message error';
        statusMsg.innerHTML = `✕ <strong>Delivery issue:</strong> ${err.message || 'Unable to send at this moment. Please try again.'}`;
        statusMsg.style.display = 'flex';
      } finally {
        submitBtn.disabled = false;
        btnText.textContent = 'Send Message';
        btnIcon.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>';
      }
    });
  }
});
</script>

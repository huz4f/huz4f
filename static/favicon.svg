<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="8"/>
  
  <!-- Subtle inner glow ring -->
  <rect x="32" y="32" width="448" height="448" rx="92" fill="none" stroke="#6366f1" stroke-width="2" stroke-opacity="0.25"/>

  <!-- Code Symbol Text: <hu/> -->
  <g filter="url(#glow)">
    <text x="256" y="315" 
          font-family="-apple-system, BlinkMacSystemFont, 'JetBrains Mono', 'Fira Code', 'SF Pro Display', monospace, sans-serif" 
          font-size="210" 
          font-weight="800" 
          letter-spacing="-8"
          fill="url(#textGrad)" 
          text-anchor="middle">&lt;hu/&gt;</text>
  </g>
</svg>

baseURL = 'https://huz4f.github.io/'
title = 'Huzaif'
theme = "PaperMod"

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[outputs]
  home = ["HTML", "RSS", "JSON"]

[minify]
  disableXML = true
  minifyOutput = true

[params]
  env = "production" # to enable google analytics, opengraph, twitter-cards, and schema.
  title = "Huzaif"
  description = "was bored created a website, now i write"
  keywords = ["Blog", "Computer Science", "Cyber Security", "Cloud", "Life"]
  author = "Huzaif"
  images = ["/huz4f.png"]
  DateFormat = "January 2, 2006"
  defaultTheme = "auto" # dark, light
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = false
  tocopen = false

  [params.label]
    text = "< 𝖍𝖚/>"
    icon = ""
    iconHeight = 69

  [params.assets]
    favicon = "/favicons/favicon.ico"
    favicon16x16 = "/favicons/favicon-16x16.png"
    favicon32x32 = "/favicons/favicon-32x32.png"
    apple_touch_icon = "/favicons/apple-touch-icon.png"
    safari_pinned_tab = "/favicons/safari-pinned-tab.svg"

  [params.profileMode]
    enabled = true # needs to be explicitly set
    title = "Welcome! 👋"
    subtitle = "i am **Huzaif** Shabir"
    imageUrl = "/favicons/me.jpg"
    imageWidth = 150
    imageHeight = 150
    imageTitle = "Huzaif"

    [[params.profileMode.buttons]]
      identifier = "Projects"
      name = "Projects"
      url = "/projects/"

    [[params.profileMode.buttons]]
      identifier = "Blogs"
      name = "Blogs"
      url = "/blogs/"

    [[params.profileMode.buttons]]
      identifier = "Explore"
      name = "Explore"
      url = "/tags/"

### [[params.socialIcons]]
    name = "x"
    url = "https://twitter.com/hu_z4f"

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/huz4f/"

  [[params.socialIcons]]
    name = "Github"
    url = "https://github.com/huz4f"

###  [[params.socialIcons]]
    name = "StackOverflow"
    url = "https://stackoverflow.com/users/21145510/huz4f"

  [params.analytics.google]
    SiteVerificationTag = ""

  [params.analytics.bing]
    SiteVerificationTag = ""

  [params.analytics.yandex]
    SiteVerificationTag = ""

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

[[menu.main]]
  identifier = "search"
  name = "Search"
  url = "/search/"
  weight = 1

[[menu.main]]
  identifier = "Tech"
  name = "Tech"
  url = "/articles/"
  weight = 2

[[menu.main]]
  identifier = "Blogs"
  name = "Blogs"
  url = "/blogs/"
  weight = 3

